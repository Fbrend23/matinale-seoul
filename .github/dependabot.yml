# Mises à jour de dépendances, par pull request.
#
# POURQUOI. Le dernier gros commit du dépôt est « Passer à Astro 7, qui referme
# les treize alertes » : la dette s'était accumulée jusqu'à devenir un chantier.
# Une PR par mois la garde à la taille d'une relecture.
#
# Ce qui rend ces PR sûres à fusionner est le workflow Contrôle : il joue les
# tests dans les deux fuseaux et vérifie les types sur chacune d'elles. Sans
# lui, Dependabot ne ferait que proposer des changements que personne ne sait
# juger.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      # La convention du dépôt : type(Portée) Sujet à l'infinitif.
      prefix: 'chore(Dépendances)'
    groups:
      # Astro et ses intégrations montent ensemble : les séparer produirait des
      # PR qui se cassent l'une l'autre.
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          # Le vérificateur de types et TypeScript forment un couple : les
          # monter séparément est exactement ce qui vient d'échouer.
          - 'typescript'

    ignore:
      # TypeScript ne peut pas franchir une majeure tant que @astrojs/check ne
      # suit pas : sa dernière version, 0.9.10, exige encore « ^5 || ^6 » en
      # dépendance de pair, et « npm ci » refuse la combinaison. Vu dès la
      # première PR ouverte par cette configuration, le 11 septembre 2026 : elle
      # échouait à l'installation, et Dependabot l'aurait rouverte indéfiniment.
      #
      # À LEVER dès que @astrojs/check élargit sa plage. Le signe à guetter est
      # une PR du groupe « astro » qui le monte de version ; « typescript » la
      # suivra alors sans rien casser.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(CI)'
