# Publication de La Matinale de Séoul.
#
# Un seul job, du fichier déposé par l'agent jusqu'au site en ligne : ingestion,
# build, déploiement, archivage. Aucune pièce intermédiaire, donc aucun endroit
# où la chaîne puisse s'arrêter sans que personne ne l'apprenne.
#
# Deux déclencheurs, et aucun cron :
#   push (inbox/**)     → l'agent a déposé le brief du jour, c'est le cas normal
#   workflow_dispatch   → relance manuelle, et bouton « Mettre le site en ligne »
#                         du CMS, posé sur mat_publication
#
# Un rebuild nocturne a existé ici, pour tenir à jour l'avis « le brief du jour
# n'est pas encore paru » que l'accueil calculait au build. Une reconstruction
# complète chaque nuit — et les minutes d'un dépôt privé — pour une seule phrase :
# l'avis est désormais décidé chez le lecteur, et le site ne se reconstruit plus
# que lorsqu'il a réellement quelque chose de neuf à dire.
#
# Garde-fou de déploiement : un fichier vide, NOMMÉ D'APRÈS CE SITE, doit exister
# à la racine du compte FTP, déposé une fois à la main. Son nom est la variable
# DEPLOY_MARKER. Si les secrets pointent ailleurs, le marqueur n'y est pas et tout
# s'arrête AVANT la moindre écriture : le FTP n'a pas de corbeille.
#
# POURQUOI IL EST NOMMÉ. Le site de la compagnie utilisait « .deploy-cible » tout
# court. À un seul site, cela suffisait. À plusieurs, le marqueur cesse de
# discriminer précisément là où le risque est le plus grand : recopier les
# secrets FTP d'un site voisin sans les changer. Les deux comptes portent alors
# le même fichier, la garde dit oui, et le mirror --delete écrase l'autre site.
# Un marqueur qui nomme sa cible attrape ce cas ; un marqueur générique ne
# vérifie plus que l'existence d'un serveur FTP quelque part.
#
# PREMIER DÉPLOIEMENT : lancer à la main avec dry_run activé, puis lire la liste.

name: Publication

on:
  push:
    branches: [main]
    # Le déclenchement est restreint au canal d'arrivée : un commit de code ne
    # relance pas l'ingestion, et le jeton de l'agent ne peut de toute façon
    # écrire que là.
    paths: ['inbox/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'mirror en --dry-run (aucune écriture côté serveur)'
        type: boolean
        default: false

concurrency:
  group: publication
  cancel-in-progress: false

permissions:
  contents: write # déplacer inbox/ vers archive/ après publication

jobs:
  publier:
    runs-on: ubuntu-latest
    # Sans plafond, un job bloqué court jusqu'à la limite de six heures de
    # GitHub sans rien dire. Vingt-cinq minutes couvrent largement le cas normal
    # — trois à quatre minutes — et transforment un blocage en échec signalé,
    # ce qui est tout ce qu'on lui demande. Vu le 8 septembre 2026 : lftp est
    # resté neuf minutes sur une connexion qui ne venait pas.
    timeout-minutes: 25
    env:
      # Le runner tourne en UTC. Les dates du brief sont ancrées sur Asia/Seoul
      # dans le code, jamais sur l'horloge de la machine, mais autant que le
      # journal du job se lise dans le même fuseau que le contenu.
      TZ: Asia/Seoul
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --prefer-offline : le cache de setup-node vient d'être restauré.
      # --no-audit --no-fund : deux appels réseau qui n'apprennent rien à un job
      # de publication.
      - run: npm ci --prefer-offline --no-audit --no-fund

      # Les gardes sont ce qui remplace la relecture humaine : si elles sont
      # cassées, rien ne doit partir. Deux passes de fuseau, parce qu'un brief
      # daté à Séoul et un runner en UTC sont à quinze heures l'un de l'autre.
      - name: Tests (fuseau de Séoul)
        run: npm test
      - name: Tests (runner en UTC)
        run: npm test
        env:
          TZ: UTC

      # 0 · Un build privé de ses sources RÉUSSIRAIT s'il avait de quoi retomber.
      #     Ce site n'a rien : pas de contenu local, pas de repli. On ferme
      #     quand même la porte ici, pour que le message dise ce qui manque
      #     plutôt que de laisser une erreur d'Astro le faire à sa place.
      - name: Refuser un build sans ses sources
        run: |
          manquantes=""
          for v in DIRECTUS_URL DIRECTUS_BUILD_TOKEN DIRECTUS_INGEST_TOKEN SITE_URL DEPLOY_MARKER; do
            if [ -z "${!v:-}" ]; then
              manquantes="$manquantes $v"
            fi
          done
          if [ -n "$manquantes" ]; then
            echo "::error::Sources absentes :$manquantes"
            echo "DIRECTUS_URL, DIRECTUS_BUILD_TOKEN et DIRECTUS_INGEST_TOKEN sont des"
            echo "secrets du dépôt ; SITE_URL et DEPLOY_MARKER sont des variables"
            echo "(Settings > Variables). DEPLOY_MARKER nomme le fichier témoin"
            echo "déposé à la racine du compte FTP de CE site, et de lui seul."
            exit 1
          fi
          echo "Les cinq sources sont fournies."
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}
          DIRECTUS_INGEST_TOKEN: ${{ secrets.DIRECTUS_INGEST_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_MARKER: ${{ vars.DEPLOY_MARKER }}

      # apt-get update rafraîchit TOUS les index de paquets — dix à vingt-cinq
      # secondes — pour installer un seul binaire. On tente d'abord sans, et on
      # ne rafraîchit que si l'index du runner est trop vieux pour connaître
      # lftp. Le repli garde l'étape sûre : elle échoue toujours si le paquet
      # est réellement introuvable, elle ne fait que cesser de payer d'avance.
      #
      # Ce que ça gagne ne va pas dans la facture — le dépôt est public, donc
      # les minutes sont gratuites — mais dans la marge avant 8 h, heure de
      # Séoul, qui ne fait que quatorze minutes depuis le passage à 7 h 30.
      - name: Installer lftp
        run: |
          sudo apt-get install -y -qq lftp \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }

      # 1 · Garde-fou AVANT TOUT : la cible doit porter SON marqueur, celui de ce
      #     site et d'aucun autre. Un simple listage, aucune écriture : le placer
      #     ici sépare « ta cible est fausse » de « ton contenu manque », deux
      #     diagnostics qu'un même échec confondrait.
      - name: Vérifier la cible de déploiement
        env:
          DEPLOY_MARKER: ${{ vars.DEPLOY_MARKER }}
        run: |
          # Deux causes d'échec sans rapport l'une avec l'autre, qu'il faut
          # séparer : la connexion, puis la cible.
          if ! racine=$(lftp -u "$FTP_USER,$FTP_PASSWORD" \
            -e "set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set dns:fatal-timeout 20; set ftp:ssl-force yes; set cmd:fail-exit yes; cls -l; quit" \
            "$FTP_HOST" 2>&1); then
            echo "::error::Connexion FTP impossible. Le marqueur n'est pas en cause."
            echo "$racine" | sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g'
            echo "FTP_HOST doit être le serveur FTP de l'hébergeur, pas le domaine du site."
            exit 1
          fi

          echo "Connexion établie. Racine vue par ce compte FTP :"
          echo "$racine" | sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g'

          # -F : le nom vient d'une variable, il est comparé littéralement.
          # Le « $ » de fin de mot évite qu'un marqueur voisin plus long passe
          # pour celui-ci.
          if ! echo "$racine" | grep -qF " $DEPLOY_MARKER"; then
            echo "::error::Marqueur « $DEPLOY_MARKER » absent de cette racine, abandon."
            echo "Vérifier D'ABORD que le listage ci-dessus est bien CE site : c'est là"
            echo "que le mirror --delete écrira. Un autre de vos sites porte peut-être"
            echo "son propre marqueur, ce qui ne l'autorise pas pour autant à recevoir"
            echo "celui-ci — c'est exactement ce que cette garde vérifie."
            echo "Puis y déposer un fichier vide nommé « $DEPLOY_MARKER »."
            exit 1
          fi

          echo "Marqueur « $DEPLOY_MARKER » présent, la cible est la bonne."

      # 2 · Le nom du fichier dit de quel jour on parle, et il est écrit par un
      #     agent. Un nom hors format est refusé avant même d'être ouvert : sans
      #     cela, un fichier mal nommé serait ingéré sous une date devinée.
      - name: Vérifier ce que contient l'inbox
        id: inbox
        run: |
          shopt -s nullglob
          fichiers=(inbox/*)
          hors_format=()
          for f in "${fichiers[@]}"; do
            nom=$(basename "$f")
            [ "$nom" = ".gitkeep" ] && continue
            if ! echo "$nom" | grep -qE '^brief-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'; then
              hors_format+=("$nom")
            fi
          done

          if [ ${#hors_format[@]} -gt 0 ]; then
            echo "::error::Fichiers hors format dans inbox/ : ${hors_format[*]}"
            echo "Attendu : brief-AAAA-MM-JJ.json"
            exit 1
          fi

          # Le motif plutôt que « ls | wc -l » : nullglob est déjà posé plus
          # haut, un dossier vide rend donc un tableau vide, et le compte ne
          # dépend plus de la façon dont ls présente des noms inhabituels.
          a_ingerer=(inbox/brief-*.json)
          briefs=${#a_ingerer[@]}
          echo "briefs=$briefs" >> "$GITHUB_OUTPUT"
          echo "$briefs brief(s) à ingérer."

      # 3 · Les cinq gardes, puis l'écriture dans le CMS. Le jeton est celui de
      #     la policy « mat — écriture » : ni l'admin, ni celui du build.
      #     Un brief recalé fait échouer le job — c'est le mail d'alerte — et son
      #     fichier reste dans inbox/ pour être rejoué.
      - name: Ingérer les briefs déposés
        if: steps.inbox.outputs.briefs != '0'
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_INGEST_TOKEN }}
        run: node scripts/ingest.mjs

      # 4 · Build. Séquentiel : pas de publication si le build échoue, donc le
      #     site en ligne reste celui d'hier quand le CMS est injoignable. Le
      #     jeton change de main ici : lecture seule du contenu publié.
      - name: Construire le site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_BUILD_TOKEN }}
        run: npm run build

      # 5 · Publication. build.json part SEUL et EN DERNIER : c'est lui qui
      #     atteste que tout le reste est déjà arrivé. Dans le mirror il aurait
      #     suivi --parallel=4 et aurait pu être déposé en premier.
      - name: Déployer
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          DEPLOY_MARKER: ${{ vars.DEPLOY_MARKER }}
        run: |
          set -o pipefail

          # lftp imprime des URL contenant le mot de passe, encodé en URL. La
          # chaîne encodée ne correspondant plus au secret, GitHub ne la masque
          # pas : on rédige nous-mêmes avant que ça n'atteigne les logs.
          publier() {
            lftp -u "$FTP_USER,$FTP_PASSWORD" \
              -e "set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set dns:fatal-timeout 20; set ftp:ssl-force yes; set cmd:fail-exit yes; $1; quit" \
              "$FTP_HOST" 2>&1 | sed -E 's#(ftps?|sftp)://[^[:space:]]*@#\1://***@#g'
          }

          # Le marqueur est exclu du --delete : il ne vient pas de dist/, donc le
          # mirror l'effacerait, et le déploiement SUIVANT échouerait faute de le
          # trouver. Une panne à retardement, deux jours après le changement.
          publier "mirror -R --delete --parallel=4 --verbose $DRY_RUN --exclude-glob $DEPLOY_MARKER --exclude-glob .user.ini --exclude-glob .infomaniak-maintenance.html --exclude-glob build.json dist/ ./"

          if [ -n "$DRY_RUN" ]; then
            echo "dry-run : build.json n'est pas envoyé."
          else
            publier "put dist/build.json -o build.json"
          fi

      # 6 · Le brief est en ligne : son fichier quitte l'inbox. Rangé par année,
      #     sinon le dossier compte trois cents fichiers au bout d'un an.
      #     APRÈS le déploiement, jamais avant : un fichier archivé alors que la
      #     publication a échoué serait un brief perdu, sans trace de son passage.
      - name: Archiver les briefs publiés
        if: ${{ success() && !inputs.dry_run && steps.inbox.outputs.briefs != '0' }}
        run: |
          shopt -s nullglob
          deplaces=0
          for f in inbox/brief-*.json; do
            annee=$(basename "$f" | sed -E 's/^brief-([0-9]{4}).*/\1/')
            mkdir -p "archive/$annee"
            git mv "$f" "archive/$annee/"
            deplaces=$((deplaces + 1))
          done

          if [ "$deplaces" -eq 0 ]; then
            echo "Rien à archiver."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] : ce commit touche inbox/, donc il rentrerait dans le
          # filtre « paths » du déclencheur et relancerait le job en boucle.
          git commit -m "chore(Archive) Ranger $deplaces brief(s) publié(s) [skip ci]"
          git push

      # 7 · Dater la publication dans le CMS, une fois le site vraiment en ligne.
      #     Un échec ici ne casse pas le run : le site EST publié, et laisser la
      #     date en retard est moins faux que de déclarer le contraire.
      - name: Dater la publication dans le CMS
        if: ${{ success() && !inputs.dry_run }}
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_INGEST_TOKEN }}
        run: |
          maintenant=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o reponse.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $DIRECTUS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"last_published\":\"$maintenant\"}" \
            "$DIRECTUS_URL/items/mat_publication")

          if [ "$code" = "200" ]; then
            echo "CMS daté : $maintenant"
          else
            echo "::warning::Le CMS n'a pas accepté la date (HTTP $code). Le site est en ligne."
            sed -E 's/[A-Za-z0-9_-]{20,}/***/g' reponse.json | head -c 300
          fi
          rm -f reponse.json
