<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="La Matinale de Séoul">
  <!-- Un lever de soleil sur une ligne d'horizon : la matinale, et Séoul.
       En SVG plutôt qu'en .ico — quelques centaines d'octets, net à toute
       taille, et aucun pipeline d'image à introduire dans un projet qui n'en a
       aucun. La couleur suit le thème du lecteur. -->
  <style>
    .trait { stroke: #9a3412; }
    .astre { fill: #9a3412; }
    @media (prefers-color-scheme: dark) {
      .trait { stroke: #fb923c; }
      .astre { fill: #fb923c; }
    }
  </style>
  <circle class="astre" cx="16" cy="18" r="7" />
  <g class="trait" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="3" y1="25" x2="29" y2="25" />
    <line x1="16" y1="3" x2="16" y2="6" />
    <line x1="5.6" y1="7.6" x2="7.7" y2="9.7" />
    <line x1="26.4" y1="7.6" x2="24.3" y2="9.7" />
  </g>
</svg>
